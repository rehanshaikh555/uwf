name: attendance_app
description: Attendance Management System for Teachers
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.4.0
  go_router: ^13.1.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  lucide_icons: ^0.309.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  geolocator: ^10.1.0
  device_info_plus: ^9.1.0
  pretty_dio_logger: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
